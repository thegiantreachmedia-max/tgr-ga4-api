name: Dependency lockfile and secret-history audit

on:
  push:
    branches:
      - security/prelaunch-audit-2026-11-07
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Generate and commit npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            # Apply only semver-compatible fixes; never force major upgrades.
            npm audit fix --ignore-scripts --no-fund || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "Add npm lockfile for reproducible security audits"
              git push
            fi
          else
            echo "No package.json; skipping npm lockfile."
          fi
      - name: Commit semver-compatible dependency fixes
        if: hashFiles('package-lock.json') != ''
        shell: bash
        run: |
          git add package-lock.json package.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Apply non-breaking dependency security fixes"
            git push
          fi
      - name: Run npm audit
        if: hashFiles('package.json') != ''
        run: npm audit --audit-level=high
      - name: Run project checks after dependency updates
        if: always() && hashFiles('package.json') != ''
        run: |
          npm run test --if-present
          npm run build --if-present
      - name: Scan full Git history with Gitleaks
        if: always()
        env:
          GITLEAKS_VERSION: v8.24.3
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:$GITLEAKS_VERSION detect \
            --source=/repo --log-opts=--all --redact --exit-code=1
