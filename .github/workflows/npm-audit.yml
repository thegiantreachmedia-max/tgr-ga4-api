name: npm dependency audit

on:
  push:
    branches: [security/prelaunch-audit-2026-11-07, security/markdown-renderer-release-2026-11-07]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Resolve dependencies and generate a temporary lockfile if needed
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Run npm audit
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e '
            const a = require("./npm-audit.json");
            console.log(JSON.stringify({
              metadata: a.metadata?.vulnerabilities,
              findings: Object.entries(a.vulnerabilities || {}).map(([name, v]) => ({
                name, severity: v.severity, isDirect: v.isDirect,
                range: v.range, fixAvailable: v.fixAvailable,
                advisories: (v.via || []).filter(x => typeof x === "object").map(x => x.title)
              }))
            }, null, 2));
          '
