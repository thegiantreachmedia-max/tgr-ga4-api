name: Dependency lockfile and history scan

on:
  push:
    branches:
      - security/dependency-audit-2026-11-07
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  lock-audit-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Generate lockfile and audit .
        working-directory: .
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --json > "$RUNNER_TEMP/npm-audit-root.json" || true
          node -e 'const fs=require("fs"); const p=process.env.AUDIT_FILE; const a=JSON.parse(fs.readFileSync(p,"utf8")); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2));' 
        env:
          AUDIT_FILE: ${{ runner.temp }}/npm-audit-root.json
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git commit -m "Add deterministic npm lockfiles"
          git push origin HEAD
      - name: Scan complete Git history with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Scan all reachable Git history
        run: |
          gitleaks git --redact --exit-code 2 --report-format sarif --report-path "$RUNNER_TEMP/gitleaks-full-history.sarif" --log-opts="--all"
