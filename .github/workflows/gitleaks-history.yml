name: Gitleaks full-history scan

on:
  push:
    branches:
      - security/prelaunch-audit-2026-11-07
      - security/markdown-renderer-release-2026-11-07
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full Git history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect \
            --source=/repo --redact --verbose --exit-code=1
